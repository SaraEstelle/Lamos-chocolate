{% extends "base/base.html" %}
{% load i18n %}
{% block content %}
<section class="section container" style="max-width:560px;">
  <span class="eyebrow">{% trans "Professional space" %}</span>
  <h1 class="h-display mb-4">{% trans "Create your pro account" %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="small" style="color:var(--c-danger)">{{ field.errors|striptags }}</p>{% endif %}
      </div>
    {% endfor %}
    <button class="btn btn-gold btn-lg mt-3" type="submit">{% trans "Submit for validation" %}</button>
  </form>
</section>
{% endblock %}
