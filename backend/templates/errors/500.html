{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>500 — Lamos Chocolate</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#faf8f4;
      color:#3a342c;
      font-family:'Lato',sans-serif;
      text-align:center;
      padding:2rem;
    }
    .code{
      font-family:'Cormorant Garamond',serif;
      font-size:5rem;
      color:#b0892f;
      line-height:1;
    }
    .eyebrow{
      font-family:'Cinzel',serif;
      font-size:.6rem;
      letter-spacing:.4em;
      text-transform:uppercase;
      color:#8a6a1f;
    }
    h1{
      font-family:'Cormorant Garamond',serif;
      font-weight:300;
      font-size:2rem;
      color:#1c1814;
      margin:.5rem 0 1rem;
    }
    a{
      display:inline-block;
      margin-top:1rem;
      font-family:'Cinzel',serif;
      font-size:.62rem;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:#fff;
      background:#b0892f;
      padding:.85rem 1.9rem;
      text-decoration:none;
      border-radius:2px;
    }
  </style>
</head>
<body>
  <div>
    <div class="code">500</div>
    <p class="eyebrow">{% trans "Server error" %}</p>
    <h1>{% trans "Something went wrong on our side." %}</h1>
    <p style="color:#6b6256;">
      {% trans "We've been notified. Please try again in a moment." %}
    </p>
    <a href="/">{% trans "Back to home" %}</a>
  </div>
</body>
</html>
