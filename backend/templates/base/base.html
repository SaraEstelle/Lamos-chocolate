{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% trans 'Lamos Chocolate — Swiss artisan chocolate' %}">
    <title>{% block title %}Lamos Chocolate{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Sticky footer: body is a full-height flex column so <main> grows and
         pushes the footer to the bottom even on short pages. -->
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex: 1 0 auto; }
        footer { flex-shrink: 0; }
    </style>
    {% load static %}
    <!-- Marble Edition fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <!-- Brand layer (loads AFTER Bootstrap so it can override it) -->
    <link href="{% static 'css/brand.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>

    {% include "base/navbar.html" %}

    <main>
        {% include "base/messages.html" %}

        {% block content %}{% endblock %}
    </main>

    {% include "base/footer.html" %}

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
