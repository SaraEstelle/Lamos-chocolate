{% load i18n %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">🍫 Lamos Chocolate</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'shop:catalog' %}">{% trans "Shop" %}</a></li>
      </ul>
      <ul class="navbar-nav">
        {% if request.user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'accounts:logout' %}">{% trans "Log out" %}</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">{% trans "Log in" %}</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'accounts:register' %}">{% trans "Sign up" %}</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
