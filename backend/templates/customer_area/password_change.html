{% extends "customer_area/base_account.html" %}
{% load i18n %}
{% block account_content %}
  <h1 class="h-display">{% trans "Change password" %}</h1>
  <form method="post" novalidate style="max-width:480px;">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="small" style="color:var(--c-danger)">{{ field.errors|striptags }}</p>{% endif %}
      </div>
    {% endfor %}
    <button class="btn btn-gold mt-3" type="submit">{% trans "Update password" %}</button>
  </form>
{% endblock %}
