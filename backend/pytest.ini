# ============================================================================
# pytest.ini
# ============================================================================
# Configuration de pytest (outil de test automatisé)
#
# Qu'est-ce que pytest fait ?
# 1. Cherche tous les fichiers test_*.py ou *_tests.py
# 2. Lance chaque test dedans
# 3. Affiche les résultats (✅ passé, ❌ échoué)
# 4. Calcule la couverture (% du code testé)
# 5. Bloque le CI/CD si couverture < 70%
# ============================================================================

[pytest]

# ============================================================================
# PARAMÈTRES ESSENTIELS
# ============================================================================

# Dire à pytest qu'on utilise Django et le fichier settings/test.py
DJANGO_SETTINGS_MODULE = config.settings.test

# Chemins où chercher les tests
testpaths = tests

# Motifs de fichiers de test
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# ============================================================================
# OPTIONS DE RAPPORT (comment afficher les résultats)
# ============================================================================
addopts =
    # Mode verbose — afficher chaque test
    -v

    # Afficher les tests qui PASSENT (+), ÉCHOUENT (F), SKIP (s), ERROR (E)
    -ra

    # Format court des erreurs (au lieu de tout le stacktrace)
    --tb=short

    # ============================================================================
    # COUVERTURE DE CODE (% du code testé)
    # ============================================================================

    # Mesurer la couverture pour l'app "apps" seulement
    --cov=apps

    # Afficher un rapport texte avec les lignes non testées
    --cov-report=term-missing

    # Afficher aussi un rapport HTML (dans htmlcov/index.html)
    --cov-report=html

    # 🔴 BLOQUANT : échouer si couverture < 70%
    # (le projet ne dépasse pas les tests si pas assez testé)
    --cov-fail-under=70

# ============================================================================
# EXCLUSIONS
# ============================================================================
# Ne pas tester ces fichiers/dossiers
omit =
    # Ne pas compter les fichiers de migration (auto-générés par Django)
    */migrations/*

    # Ne pas compter les fichiers __pycache__
    */__pycache__/*

    # Ne pas compter les fichiers setup
    */setup.py

# ============================================================================
# COMPORTEMENT DES TESTS
# ============================================================================

# Timeout pour chaque test (en secondes)
# Si un test prend > 10 sec, pytest le tue
timeout = 10

# Autoriser pytest-django à créer une DB de test
django_find_project = false

# Logs — afficher les logs Django pendant les tests (utile pour debug)
log_cli = false
log_level = INFO