# ============================================================================
# pytest.ini
# ============================================================================
# Configuration de pytest (outil de test automatisé)
#
# Qu'est-ce que pytest fait ?
# 1. Cherche tous les fichiers test_*.py ou *_tests.py
# 2. Lance chaque test dedans
# 3. Affiche les résultats (✅ passé, ❌ échoué)
# 4. Calcule la couverture (% du code testé)
# 5. Bloque le CI/CD si couverture < 70%
#
# Règles de couverture Lamos Chocolate :
# - Minimum 70% pour les apps core (accounts, shop, checkout)
# - Minimum 60% pour les apps secondaires (cart, customer_area)
# - Toutes les fonctions critiques (paiement, auth) doivent être à 100%
# ============================================================================

[pytest]

# ============================================================================
# PARAMÈTRES ESSENTIELS
# ============================================================================

# Dire à pytest qu'on utilise Django avec le fichier settings/test.py
# C'est important : sans ça, pytest ne peut pas accéder aux models
DJANGO_SETTINGS_MODULE = config.settings.test

# Chemins où chercher les tests
# Tous les fichiers test_*.py dans le dossier "tests" seront exécutés
testpaths = tests

# Motifs de fichiers/classes/fonctions de test
# test_auth.py, test_models.py, test_views.py seront trouvés
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# ============================================================================
# OPTIONS DE RAPPORT (comment afficher les résultats)
# ============================================================================
addopts =
    # Mode verbose — afficher chaque test individuellement
    -v

    # Afficher les tests qui PASSENT (+), ÉCHOUENT (F), SKIP (s), ERROR (E)
    -ra

    # Format court des erreurs (au lieu d'afficher 100 lignes de stacktrace)
    --tb=short

    # ============================================================================
    # COUVERTURE DE CODE (% du code testé) — TRÈS IMPORTANT
    # ============================================================================

    # Mesurer la couverture pour l'app "apps" seulement
    # (pas django.contrib, pas les migrations)
    --cov=apps

    # Afficher un rapport texte avec les lignes NON testées
    # Utile pour voir ce qui manque comme tests
    --cov-report=term-missing

    # Afficher aussi un rapport HTML (dans htmlcov/index.html)
    # Ouvrir dans le navigateur pour voir la couverture visuelle
    --cov-report=html

    # 🔴 BLOQUANT : échouer si couverture < 70%
    # Le CI/CD ne passera pas tant qu'on n'a pas 70% de couverture
    # Exception : pour les fonctionnalités très nouvelles, on peut baisser à 60%
    --cov-fail-under=70

# ============================================================================
# EXCLUSIONS — Fichiers à ne pas tester
# ============================================================================
omit =
    # Ne pas compter les fichiers de migration (auto-générés par Django)
    # Les migrations sont générées par `makemigrations`, pas écrites à la main
    */migrations/*

    # Ne pas compter les fichiers __pycache__ (cache Python)
    */__pycache__/*

    # Ne pas compter les fichiers setup.py
    */setup.py

    # Ne pas compter les fichiers __init__.py (sauf s'ils ont du code)
    */__init__.py

# ============================================================================
# COMPORTEMENT DES TESTS
# ============================================================================

# Timeout pour chaque test (en secondes)
# Si un test prend > 10 sec, pytest le tue
# Utile pour détecter les tests qui font des requêtes HTTP bloquées
timeout = 10

# Autoriser pytest-django à chercher les modèles Django
# Ne pas changer cette valeur
django_find_project = false

# Logs — afficher les logs Django pendant les tests (utile pour debug)
# À False par défaut (pour une sortie propre)
log_cli = false
log_level = INFO

# ============================================================================
# MARKERS — Catégoriser les tests
# ============================================================================
# Permet d'exécuter seulement certains tests :
# pytest -m unit              → tests unitaires seulement
# pytest -m integration       → tests d'intégration seulement
# pytest -m "not slow"        → tous sauf les tests lents
# ============================================================================
markers =
    unit: Test unitaire (teste une fonction isolée)
    integration: Test d'intégration (teste plusieurs composants)
    slow: Test lent (> 1 seconde)
    auth: Tests d'authentification (login, register, reset)
    payment: Tests de paiement (Stripe, webhooks)
    db: Tests qui accèdent à la base de données