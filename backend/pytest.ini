# ============================================================================
# pytest.ini — Central configuration for automated testing
# This file tells pytest how to discover tests, load Django, and run coverage.
# ============================================================================

[pytest]

# Django settings module used for tests
DJANGO_SETTINGS_MODULE = config.settings.test

# Disable automatic Django project discovery
# (we explicitly provide the settings module above)
django_find_project = false

# Directories where pytest should look for tests
testpaths = apps

# Naming conventions for test files, classes, and functions
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Default pytest options
addopts =
    -v                      # verbose output
    -ra                     # show summary of skipped/failed tests
    --tb=short              # shorter tracebacks
    --cov=apps              # measure coverage on the "apps" directory
    --cov-report=term-missing   # show missing lines in terminal
    --cov-report=html           # generate HTML coverage report
    --cov-fail-under=70         # fail if coverage < 70%

# Files and folders to exclude from coverage
omit =
    */migrations/*
    */__pycache__/*
    */setup.py
    */__init__.py

# Timeout for each test (in seconds)
timeout = 10

# Logging configuration
log_cli = false
log_level = INFO

# Custom markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (> 1 second)
    auth: Authentication tests
    payment: Payment tests
    db: Database tests
